services:
  client:
    container_name: vehka-client
    build:
      context: ./
      dockerfile: ./Dockerfile
    command: ["pnpm", "run", "dev"]
    ports:
      - 3000:3000
    environment:
      # Reach the db service over the compose network, not the container's own
      # localhost. Everything else here is a dev-only default so the stack runs
      # with no .env file present.
      DB_HOST: db
      DB_NAME: vehka
      DB_USER: postgres
      DB_PASS: pass
      DB_PORT: 5432
      AUTH_SECRET: dev-only-auth-secret
      ADMIN_PASS: devadmin
    volumes:
      - ./:/app
      # Keep container-managed directories in their own volumes so the container
      # never fights the host over node_modules or the .next build cache, and
      # never writes them back into the project tree.
      - /app/node_modules
      - /app/.next
    depends_on:
      db:
        condition: service_healthy

  db:
    container_name: vehka-db
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: pass
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - 5432:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data:
